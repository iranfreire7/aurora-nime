
name: Gerar APK Aurora Nime

on:
  workflow_dispatch:
  push:
    paths:
      - 'AuroraNime.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -q AuroraNime.zip -d projeto

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar Android
        working-directory: projeto/Aurora_Nime_Flutter
        run: flutter create --platforms=android .

      - name: Instalar dependências
        working-directory: projeto/Aurora_Nime_Flutter
        run: flutter pub get

      - name: Compilar APK
        working-directory: projeto/Aurora_Nime_Flutter
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Nime-APK
          path: projeto/Aurora_Nime_Flutter/build/app/outputs/flutter-apk/app-release.apk
          
