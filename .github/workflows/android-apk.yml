
name: Gerar APK Aurora Nime

on:
  workflow_dispatch:
  push:
    paths:
      - 'AuroraNime.zip'
      - '.github/workflows/android-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar arquivos
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p projeto
          unzip -q AuroraNime.zip -d projeto

      - name: Localizar projeto Flutter
        id: localizar
        run: |
          PROJECT_DIR=$(find projeto -name pubspec.yaml -print -quit | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Não encontrei pubspec.yaml no ZIP"
            find projeto -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Preparar Android
        working-directory: ${{ steps.localizar.outputs.dir }}
        run: flutter create --platforms=android .

      - name: Instalar dependências
        working-directory: ${{ steps.localizar.outputs.dir }}
        run: flutter pub get

      - name: Compilar APK
        working-directory: ${{ steps.localizar.outputs.dir }}
        run: flutter build apk --release

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Aurora-Nime-APK
          path: ${{ steps.localizar.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
